# Deploys the code-review orchestrator (Temporal worker + webhook receiver).
#
# Prerequisites:
#   - A reachable Temporal cluster. For k8s, the official Helm chart:
#       helm repo add temporal https://temporalio.github.io/helm-charts
#       helm install temporal temporal/temporal -n temporal --create-namespace
#     Then edit temporal.hostPort in deploy/k8s/orchestrator.config.json to
#     match your frontend Service (default below assumes the chart's name).
#   - The image built from the repo Dockerfile (same image as the gateway).
#
# Before applying:
#   1. Edit deploy/k8s/orchestrator.config.json (Temporal address, sink type).
#      For the "github" sink, also create the token secret referenced below:
#        kubectl -n agent-gateway create secret generic orchestrator-tokens \
#          --from-literal=WEBHOOK_TOKEN="$(openssl rand -hex 24)" \
#          --from-literal=GITHUB_TOKEN="<your-pat-or-empty>"
#      Prefer piping values over stdin so they never land in argv/shell history:
#        printf '{"stringData":{"CURSOR_API_KEY":"%s"}}' "$KEY" | \
#          kubectl -n agent-gateway patch secret orchestrator-tokens --type=merge --patch-file=/dev/stdin
#      (CURSOR_API_KEY runs the cursor-reviewer; GITHUB_TOKEN needs `repo` scope
#      for diffs, comments and the pr-poller.)
#   2. kubectl -n agent-gateway create configmap orchestrator-config \
#        --from-file=config.json=deploy/k8s/orchestrator.config.json
#   3. Set the image below, then: kubectl apply -f deploy/k8s/orchestrator.yaml
#   4. review.maxDiffBytes is read only at process start. After changing it,
#      replace ConfigMap orchestrator-config and restart this Deployment.
#      Leave worker.maxConcurrentActivities and the 12m/15m timeouts alone.
#      No env var overrides the byte budget.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  namespace: agent-gateway
  labels:
    app: orchestrator
spec:
  # Keep a single replica: the webhook can run replicated, but one worker is
  # plenty for a home lab, and the file sink writes to a pod-local volume.
  replicas: 1
  selector:
    matchLabels:
      app: orchestrator
  template:
    metadata:
      labels:
        app: orchestrator
    spec:
      containers:
        - name: orchestrator
          image: <your-registry>/agent-gateway:0.2.3
          command: ["/app/orchestrator"]
          ports:
            - containerPort: 4819
              name: webhook
          env:
            # Key the reviewer presents to the in-cluster MCP gateway; referenced
            # from the gateway's own secret, never copied.
            - name: GATEWAY_REVIEWER_KEY
              valueFrom:
                secretKeyRef:
                  name: gateway-keys
                  key: GATEWAY_REVIEWER_KEY
                  optional: true
            - name: AGENTFLOW_GATEWAY_URL
              value: http://agent-gateway.agent-gateway.svc.cluster.local/mcp
            - name: CURSOR_REVIEW_MODEL
              value: grok-4.7
            # Informational: the orchestrator overrides this per run with
            # review.reviewerTimeout from the config (default 12m).
            - name: CURSOR_REVIEW_TIMEOUT
              value: 12m
          envFrom:
            - secretRef:
                name: orchestrator-tokens
                optional: true
          volumeMounts:
            - name: config
              mountPath: /etc/orchestrator
              readOnly: true
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /healthz
              port: webhook
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: webhook
            initialDelaySeconds: 5
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              # Up to worker.maxConcurrentActivities (4) Cursor CLI processes.
              memory: 3Gi
      volumes:
        - name: config
          configMap:
            name: orchestrator-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: orchestrator
  namespace: agent-gateway
  labels:
    app: orchestrator
spec:
  # ClusterIP only: no NodePort/LoadBalancer. PRs are discovered by the
  # pr-poller schedule, so no public webhook is needed.
  type: ClusterIP
  selector:
    app: orchestrator
  ports:
    - name: webhook
      port: 80
      targetPort: webhook
