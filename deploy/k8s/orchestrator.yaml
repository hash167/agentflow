# Deploys the code-review orchestrator (Temporal worker + webhook receiver).
#
# Prerequisites:
#   - A reachable Temporal cluster. For k8s, the official Helm chart:
#       helm repo add temporal https://temporalio.github.io/helm-charts
#       helm install temporal temporal/temporal -n temporal --create-namespace
#     Then edit temporal.hostPort in deploy/k8s/orchestrator.config.json to
#     match your frontend Service (default below assumes the chart's name).
#   - The image built from the repo Dockerfile (same image as the gateway).
#
# Before applying:
#   1. Edit deploy/k8s/orchestrator.config.json (Temporal address, sink type).
#      For the "github" sink, also create the token secret referenced below:
#        kubectl -n agent-gateway create secret generic orchestrator-tokens \
#          --from-literal=WEBHOOK_TOKEN="$(openssl rand -hex 24)" \
#          --from-literal=GITHUB_TOKEN="<your-pat-or-empty>"
#   2. kubectl -n agent-gateway create configmap orchestrator-config \
#        --from-file=config.json=deploy/k8s/orchestrator.config.json
#   3. Set the image below, then: kubectl apply -f deploy/k8s/orchestrator.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  namespace: agent-gateway
  labels:
    app: orchestrator
spec:
  # Keep a single replica: the webhook can run replicated, but one worker is
  # plenty for a home lab, and the file sink writes to a pod-local volume.
  replicas: 1
  selector:
    matchLabels:
      app: orchestrator
  template:
    metadata:
      labels:
        app: orchestrator
    spec:
      containers:
        - name: orchestrator
          image: <your-registry>/agent-gateway:0.1.0
          command: ["/app/orchestrator"]
          ports:
            - containerPort: 4819
              name: webhook
          envFrom:
            - secretRef:
                name: orchestrator-tokens
                optional: true
          volumeMounts:
            - name: config
              mountPath: /etc/orchestrator
              readOnly: true
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /healthz
              port: webhook
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: webhook
            initialDelaySeconds: 5
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: orchestrator-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: orchestrator
  namespace: agent-gateway
  labels:
    app: orchestrator
spec:
  selector:
    app: orchestrator
  ports:
    - name: webhook
      port: 80
      targetPort: webhook
